<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
  </defs>

  <!-- Background rounded shield -->
  <rect width="100" height="100" rx="22" fill="url(#bgGlow)"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Piston Top Crown -->
  <rect x="42" y="15" width="16" height="18" rx="2" fill="url(#steelGrad)"/>
  <!-- Piston Ring Grooves -->
  <line x1="42" y1="19" x2="58" y2="19" stroke="#09090b" stroke-width="1.5"/>
  <line x1="42" y1="23" x2="58" y2="23" stroke="#09090b" stroke-width="1.5"/>
  <!-- Piston Pin Hole -->
  <circle cx="50" cy="27" r="2.8" fill="#09090b"/>

  <!-- Connecting Rod -->
  <rect x="47" y="32" width="6" height="24" fill="url(#steelGrad)"/>
  
  <!-- Big End Rod Journal / Ring -->
  <circle cx="50" cy="62" r="8" fill="none" stroke="url(#steelGrad)" stroke-width="4"/>
  <circle cx="50" cy="62" r="4" fill="#09090b"/>

  <!-- Aerodynamic 'M' Wings in Crimson Red -->
  <!-- Left Wing -->
  <path d="M 50 48 L 22 26 L 16 32 L 32 50 L 40 56 L 50 48 Z" fill="url(#redGrad)"/>
  <path d="M 22 36 L 10 40 L 16 46 L 28 44 Z" fill="url(#steelGrad)"/>
  <path d="M 28 46 L 18 52 L 24 58 L 34 52 Z" fill="url(#steelGrad)"/>

  <!-- Right Wing -->
  <path d="M 50 48 L 78 26 L 84 32 L 68 50 L 60 56 L 50 48 Z" fill="url(#redGrad)"/>
  <path d="M 78 36 L 90 40 L 84 46 L 72 44 Z" fill="url(#steelGrad)"/>
  <path d="M 72 46 L 82 52 L 76 58 L 66 52 Z" fill="url(#steelGrad)"/>

  <!-- Central Sharp V Apex Accent -->
  <polygon points="50,54 44,48 50,42 56,48" fill="#ffffff" opacity="0.9"/>
</svg>
